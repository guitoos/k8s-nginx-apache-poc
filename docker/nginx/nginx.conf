server {
    listen 8080;
    server_name localhost;

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }

    # Endpoint simples usado pelas probes do Kubernetes (readiness/liveness)
    location /health {
        access_log off;
        return 200 'nginx OK\n';
        add_header Content-Type text/plain;
    }
}
